<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cumulative Frequency Evaluation Module v1.4</title>
    <style>
        /* Base Optimization Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-user-select: none;
            user-select: none;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Layout Framework */
        header {
            background-color: #ffffff;
            padding: 6px 16px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 44px;
            z-index: 30;
        }
        h1 {
            font-size: 1rem;
            color: #0f172a;
            font-weight: 700;
        }
        .score-board {
            display: flex;
            gap: 16px;
            font-size: 0.9rem;
            font-weight: 700;
        }
        .score.correct { color: #16a34a; }
        .score.incorrect { color: #dc2626; }

        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            height: calc(100vh - 44px);
        }

        /* Left Workspace Panel */
        .workspace-pane {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            background-color: #ffffff;
            border-right: 1px solid #e2e8f0;
            height: 100%;
            position: relative;
        }
        .workspace-toolbar {
            background-color: #f1f5f9;
            border-bottom: 1px solid #e2e8f0;
            padding: 4px 8px;
            display: flex;
            gap: 4px;
            align-items: center;
            height: 44px;
            z-index: 20;
            flex-wrap: nowrap;
            overflow-x: auto;
        }
        .tool-btn {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #475569;
            cursor: pointer;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 4px;
            height: 32px;
        }
        .tool-btn.active {
            background-color: #2563eb;
            color: #ffffff;
            border-color: #1d4ed8;
        }
        .tool-btn.action-btn {
            background-color: #f8fafc;
        }
        .tool-btn.action-btn:active {
            background-color: #e2e8f0;
        }
        .divider {
            width: 1px;
            height: 20px;
            background-color: #cbd5e1;
            margin: 0 4px;
        }

        .graph-container {
            flex: 1;
            position: relative;
            width: 100%;
            height: calc(100% - 44px);
            background-color: #ffffff;
            overflow: hidden;
        }
        #graph-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 10;
            touch-action: none;
        }

        /* Right Panel Layout */
        .interaction-pane {
            flex: 0.9;
            display: flex;
            flex-direction: column;
            background-color: #f8fafc;
            height: 100%;
            border-left: 1px solid #e2e8f0;
        }
        
        /* Question Block */
        .question-card {
            background: #ffffff;
            padding: 12px;
            border-bottom: 1px solid #e2e8f0;
        }
        .context-text, .question-text {
            font-size: 0.9rem;
            color: #334155;
            font-weight: 400;
            margin-bottom: 6px;
            line-height: 1.4;
        }
        .scaffold-badge {
            display: inline-block;
            background-color: #eff6ff;
            color: #1d4ed8;
            border: 1px solid #bfdbfe;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
            margin-top: 4px;
        }

        /* Keypad Block & Fraction Display System */
        .keypad-container {
            background-color: #ffffff;
            padding: 10px 12px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .input-display {
            width: 100%;
            height: 76px;
            border: 2px solid #cbd5e1;
            border-radius: 6px;
            background: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px 12px;
            font-size: 1.3rem;
            font-weight: 700;
            color: #0f172a;
        }
        .input-display.focused {
            border-color: #2563eb;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }
        .input-display:empty::before {
            content: "Tap keypad to enter answer...";
            color: #94a3b8;
            font-size: 0.85rem;
            font-weight: 400;
        }
        
        /* Render Stacked Fractions CSS */
        .fraction-view {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            line-height: 1.0;
            padding: 2px 0;
            height: 100%;
            width: 100%;
        }
        .frac-part {
            padding: 3px 16px;
            border-radius: 4px;
            min-width: 54px;
            text-align: center;
            font-size: 1.25rem;
            cursor: pointer;
            flex-shrink: 0;
        }
        .frac-part.active-part {
            background-color: #eff6ff;
            box-shadow: 0 0 0 2px #2563eb;
        }
        .frac-line {
            width: 60px;
            height: 2px;
            background-color: #475569;
            margin: 4px 0;
            flex-shrink: 0;
        }

        .virtual-keyboard {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }
        .vk-key {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            height: 38px;
            font-size: 1rem;
            font-weight: 700;
            color: #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            cursor: pointer;
        }
        .vk-key:active {
            background: #f1f5f9;
        }
        .vk-key.action-key {
            background: #e2e8f0;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .vk-key.submit-key {
            background: #16a34a;
            color: #ffffff;
            border-color: #15803d;
            grid-column: span 2;
        }
        .vk-key.submit-key:active {
            background: #15803d;
        }
        .next-btn {
            background: #2563eb;
            color: #ffffff;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.9rem;
            border: none;
            grid-column: span 2;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .next-btn:active {
            background: #1d4ed8;
        }

        /* Scrollable Scaffolding Area */
        .scaffold-scroll-area {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .feedback-box {
            padding: 10px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            display: none;
        }
        .feedback-box.correct { background-color: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .feedback-box.incorrect { background-color: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }

        .steps-wrapper {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .step-log-item {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            padding: 10px;
            font-size: 0.85rem;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
        }
        .step-log-item.active {
            border-color: #bfdbfe;
            background-color: #eff6ff;
            border-left: 4px solid #2563eb;
        }
        .step-title {
            font-weight: 700;
            color: #1e3a8a;
            margin-bottom: 2px;
        }
        .step-status {
            font-weight: 600;
            margin-top: 6px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Cumulative Frequency Evaluation Module</h1>
        <div class="score-board">
            <div>Correct: <span id="score-correct" class="score correct">0</span></div>
            <div>Incorrect: <span id="score-incorrect" class="score incorrect">0</span></div>
        </div>
    </header>

    <div class="main-container">
        <div class="workspace-pane">
            <div class="workspace-toolbar">
                <button class="tool-btn active" id="tool-pointer" onclick="setTool('pointer')">🖱️ Crosshair</button>
                <button class="tool-btn" id="tool-pan" onclick="setTool('pan')">✋ Pan & Zoom</button>
                <button class="tool-btn" id="tool-pen" onclick="setTool('pen')">✏️ Pen</button>
                <button class="tool-btn" id="tool-eraser" onclick="setTool('eraser')">🧽 Eraser</button>
                <div class="divider"></div>
                <button class="tool-btn action-btn" onclick="resetGraphView()">🔄 Reset View</button>
                <button class="tool-btn action-btn" onclick="clearSketches()">🗑️ Clear Pen</button>
            </div>

            <div class="graph-container">
                <svg id="graph-svg">
                    <g id="viewport-group">
                        <g id="grid-minor"></g>
                        <g id="grid-major"></g>
                        <g id="axes-layer"></g>
                        <path id="curve-path" fill="none" stroke="#2563eb" stroke-width="2.5" />
                        <g id="scaffold-overlays"></g>
                        <g id="sketch-layer"></g>
                        
                        <g id="crosshair-layer" style="display: block;">
                            <line id="ch-line-h" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="3,3" />
                            <line id="ch-line-v" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="3,3" />
                            <g id="ch-handle" style="cursor: grab;">
                                <circle cx="0" cy="0" r="18" fill="transparent" />
                                <line x1="-5" y1="0" x2="5" y2="0" stroke="#dc2626" stroke-width="2" stroke-linecap="round" />
                                <line x1="0" y1="-5" x2="0" y2="5" stroke="#dc2626" stroke-width="2" stroke-linecap="round" />
                            </g>
                        </g>
                    </g>
                </svg>
            </div>
        </div>

        <div class="interaction-pane">
            <div class="question-card">
                <div id="app-context" class="context-text"></div>
                <div id="app-question" class="question-text"></div>
                <div id="scaffold-badge-el" class="scaffold-badge" style="display: none;">Scaffolding Active Mode</div>
            </div>

            <div class="keypad-container">
                <div class="input-display focused" id="calc-display"></div>
                <div class="virtual-keyboard">
                    <div class="vk-key" onclick="pressKey('7')">7</div>
                    <div class="vk-key" onclick="pressKey('8')">8</div>
                    <div class="vk-key" onclick="pressKey('9')">9</div>
                    <div class="vk-key action-key" onclick="pressKey('backspace')">Delete</div>
                    
                    <div class="vk-key" onclick="pressKey('4')">4</div>
                    <div class="vk-key" onclick="pressKey('5')">5</div>
                    <div class="vk-key" onclick="pressKey('6')">6</div>
                    <div class="vk-key action-key" onclick="pressKey('clear')">Clear</div>
                    
                    <div class="vk-key" onclick="pressKey('1')">1</div>
                    <div class="vk-key" onclick="pressKey('2')">2</div>
                    <div class="vk-key" onclick="pressKey('3')">3</div>
                    <div class="vk-key" onclick="pressKey('.')">.</div>
                    
                    <div class="vk-key" onclick="pressKey('0')">0</div>
                    <div class="vk-key action-key" style="color:#2563eb;" onclick="pressKey('fraction')">a/b</div>
                    <button class="vk-key submit-key" id="action-submit-btn" onclick="handleSubmission()">Submit Answer</button>
                    <button class="next-btn" id="action-next-btn" onclick="advanceQuestionFlow()">Next Question ➡️</button>
                </div>
            </div>

            <div class="scaffold-scroll-area">
                <div class="feedback-box" id="app-feedback"></div>
                <div class="steps-wrapper" id="app-steps-container"></div>
            </div>
        </div>
    </div>

    <script>
        // Configuration Parameters Archetypes
        const variableContexts = [
            { name: "time spent on revision homework", unit: "minutes", noun: "students", xMin: 0, xMax: 50, xStart: 5, xEnd: 45, xLabel: "Time Spent (minutes)", yLabel: "Cumulative Frequency (Students)" },
            { name: "masses of scientific test samples", unit: "grams", noun: "samples", xMin: 0, xMax: 50, xStart: 4, xEnd: 46, xLabel: "Mass (grams)", yLabel: "Cumulative Frequency (Samples)" },
            { name: "examination grade performance scores", unit: "marks", noun: "candidates", xMin: 0, xMax: 50, xStart: 6, xEnd: 44, xLabel: "Test Score (marks)", yLabel: "Cumulative Frequency (Candidates)" },
            { name: "daily physical running durations", unit: "minutes", noun: "athletes", xMin: 0, xMax: 50, xStart: 3, xEnd: 47, xLabel: "Duration (minutes)", yLabel: "Cumulative Frequency (Athletes)" }
        ];

        const targetFrequencies = [60, 80, 100, 120];

        // Core Application State Hooks
        let scoreCorrectCount = 0, scoreIncorrectCount = 0;
        let globalCtx = null;
        let activeQuestion = null;
        let isScaffoldActive = false;
        let scaffoldStepIdx = 0;
        let currentAttempts = 0;
        let stepAttempts = 0; 
        let activeTool = 'pointer';
        let questionsCountInCurrentGraph = 0; 

        // Fraction Engine Hooks
        let isFractionMode = false;
        let activeFracPart = 'num'; 

        // Layout Metrics
        let padL = 65, padR = 30, padT = 20, padB = 50;
        let graphW = 350, graphH = 350; 
        let svgW = 445, svgH = 420;

        // Viewport Properties
        let zoomScale = 1, panX = 0, panY = 0;
        let isPanning = false, startPanPt = { x: 0, y: 0 };
        let pointerCache = [];

        // Vectors & Elements State
        let isDraggingCH = false;
        let crosshairPos = { x: 200, y: 200 };
        let isDrawingPen = false, currentPenPath = null;

        window.addEventListener('load', () => {
            initializeInteractionEngine();
            advanceQuestionFlow();
        });

        // Sync Fraction Frame Viewport
        function syncInputDisplayDOM() {
            const display = document.getElementById('calc-display');
            if (!isFractionMode) return;
            
            if (!display.querySelector('.fraction-view')) {
                display.innerHTML = `
                    <div class="fraction-view">
                        <div id="frac-num" class="frac-part ${activeFracPart === 'num' ? 'active-part' : ''}" onclick="setFracFocus(event, 'num')"></div>
                        <div class="frac-line"></div>
                        <div id="frac-den" class="frac-part ${activeFracPart === 'den' ? 'active-part' : ''}" onclick="setFracFocus(event, 'den')"></div>
                    </div>
                `;
            } else {
                document.getElementById('frac-num').className = `frac-part ${activeFracPart === 'num' ? 'active-part' : ''}`;
                document.getElementById('frac-den').className = `frac-part ${activeFracPart === 'den' ? 'active-part' : ''}`;
            }
        }

        function setFracFocus(e, part) {
            if(e) e.stopPropagation();
            activeFracPart = part;
            syncInputDisplayDOM();
        }

        function pressKey(key) {
            const display = document.getElementById('calc-display');
            
            if (key === 'fraction') {
                if (!isFractionMode) {
                    let existing = display.textContent.trim();
                    isFractionMode = true;
                    activeFracPart = existing ? 'den' : 'num';
                    
                    display.innerHTML = `
                        <div class="fraction-view">
                            <div id="frac-num" class="frac-part ${activeFracPart === 'num' ? 'active-part' : ''}" onclick="setFracFocus(event, 'num')">${existing}</div>
                            <div class="frac-line"></div>
                            <div id="frac-den" class="frac-part ${activeFracPart === 'den' ? 'active-part' : ''}" onclick="setFracFocus(event, 'den')"></div>
                        </div>
                    `;
                }
                return;
            }

            if (key === 'clear') {
                isFractionMode = false;
                activeFracPart = 'num';
                display.textContent = '';
                return;
            }

            if (!isFractionMode) {
                if (key === 'backspace') display.textContent = display.textContent.slice(0, -1);
                else if (display.textContent.length < 12 && key !== '.') display.textContent += key;
                else if (key === '.' && !display.textContent.includes('.')) display.textContent += key;
            } else {
                let activeEl = document.getElementById(`frac-${activeFracPart}`);
                if (!activeEl) return;
                
                if (key === 'backspace') {
                    activeEl.textContent = activeEl.textContent.slice(0, -1);
                } else if (key !== '.' && activeEl.textContent.length < 5) {
                    activeEl.textContent += key;
                }
            }
        }

        function setTool(tool) {
            activeTool = tool;
            document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`tool-${tool}`).classList.add('active');
            document.getElementById('ch-handle').style.cursor = (tool === 'pointer') ? 'grab' : 'default';
        }

        function resetGraphView() {
            zoomScale = 1; panX = 0; panY = 0;
            applyViewportTransform();
        }

        function clearSketches() {
            document.getElementById('sketch-layer').innerHTML = '';
        }

        function applyViewportTransform() {
            document.getElementById('viewport-group').setAttribute('transform', `translate(${panX}, ${panY}) scale(${zoomScale})`);
        }

        function roundXToHalfBox(val) { return Math.round(val * 2) / 2; }
        function roundYToHalfBox(val, cfg) {
            let unitsPerBox = cfg.totalFreq / cfg.numBoxesY;
            return Math.round(val / (unitsPerBox / 2)) * (unitsPerBox / 2);
        }

        function calcCurveY(x, cfg) {
            if (x < cfg.xStart) return 0;
            if (x > cfg.xEnd) return cfg.totalFreq;
            let normalized = (x - cfg.xStart) / (cfg.xEnd - cfg.xStart);
            let smoothstep = 3 * normalized * normalized - 2 * normalized * normalized * normalized;
            return cfg.totalFreq * smoothstep;
        }

        function calcCurveX(y, cfg) {
            if (y <= 0) return cfg.xStart;
            if (y >= cfg.totalFreq) return cfg.xEnd;
            let lower = cfg.xStart, upper = cfg.xEnd;
            for (let i = 0; i < 24; i++) {
                let mid = (lower + upper) / 2;
                if (calcCurveY(mid, cfg) < y) lower = mid;
                else upper = mid;
            }
            return (lower + upper) / 2;
        }

        function mapToSVGX(x, cfg) { return padL + (x / 50) * graphW; }
        function mapToSVGY(y, cfg) { return (svgH - padB) - (y / cfg.totalFreq) * graphH; }

        function getSVGCoords(clientX, clientY) {
            const svg = document.getElementById('graph-svg');
            const pt = svg.createSVGPoint();
            pt.x = clientX; pt.y = clientY;
            return pt.matrixTransform(document.getElementById('viewport-group').getScreenCTM().inverse());
        }

        function initializeInteractionEngine() {
            const svg = document.getElementById('graph-svg');

            svg.addEventListener('wheel', (e) => {
                e.preventDefault();
                const mousePos = getSVGCoords(e.clientX, e.clientY);
                const factor = e.deltaY < 0 ? 1.1 : 0.9;
                if (zoomScale * factor < 0.8 || zoomScale * factor > 6) return;

                panX = mousePos.x - (mousePos.x - panX) * factor;
                panY = mousePos.y - (mousePos.y - panY) * factor;
                zoomScale *= factor;
                applyViewportTransform();
            }, { passive: false });

            svg.addEventListener('pointerdown', (e) => {
                const localCoords = getSVGCoords(e.clientX, e.clientY);
                
                if (activeTool === 'pointer') {
                    if (Math.hypot(localCoords.x - crosshairPos.x, localCoords.y - crosshairPos.y) < 24) {
                        isDraggingCH = true;
                        document.getElementById('ch-handle').style.cursor = 'grabbing';
                        svg.setPointerCapture(e.pointerId);
                        return;
                    }
                }

                if (activeTool === 'pan') {
                    isPanning = true;
                    startPanPt = { x: e.clientX - panX, y: e.clientY - panY };
                    svg.setPointerCapture(e.pointerId);
                    pointerCache.push(e);
                    return;
                }

                if (activeTool === 'pen' || activeTool === 'eraser') {
                    isDrawingPen = true;
                    currentPenPath = document.createElementNS("http://www.w3.org/2000/svg", "path");
                    currentPenPath.setAttribute('fill', 'none');
                    currentPenPath.setAttribute('stroke', activeTool === 'pen' ? '#3b82f6' : '#ffffff');
                    currentPenPath.setAttribute('stroke-width', activeTool === 'pen' ? '2' : '16');
                    currentPenPath.setAttribute('stroke-linecap', 'round');
                    currentPenPath.setAttribute('stroke-linejoin', 'round');
                    currentPenPath.setAttribute('d', `M ${localCoords.x} ${localCoords.y}`);
                    document.getElementById('sketch-layer').appendChild(currentPenPath);
                    svg.setPointerCapture(e.pointerId);
                }
            });

            svg.addEventListener('pointermove', (e) => {
                const localCoords = getSVGCoords(e.clientX, e.clientY);

                if (isDraggingCH) {
                    crosshairPos.x = Math.max(padL, Math.min(padL + graphW, localCoords.x));
                    crosshairPos.y = Math.max(padT, Math.min(svgH - padB, localCoords.y));
                    updateCrosshairGraphics(crosshairPos.x, crosshairPos.y);
                    return;
                }

                if (isPanning && activeTool === 'pan') {
                    panX = e.clientX - startPanPt.x;
                    panY = e.clientY - startPanPt.y;
                    applyViewportTransform();
                    return;
                }

                if (isDrawingPen && currentPenPath) {
                    currentPenPath.setAttribute('d', `${currentPenPath.getAttribute('d')} L ${localCoords.x} ${localCoords.y}`);
                }
            });

            const endInteraction = () => {
                if (isDraggingCH) { isDraggingCH = false; document.getElementById('ch-handle').style.cursor = 'grab'; }
                isPanning = false; isDrawingPen = false; currentPenPath = null;
            };
            svg.addEventListener('pointerup', endInteraction);
            svg.addEventListener('pointerleave', endInteraction);
        }

        function updateCrosshairGraphics(cx, cy) {
            document.getElementById('ch-handle').setAttribute('transform', `translate(${cx}, ${cy})`);
            
            document.getElementById('ch-line-h').setAttribute('x1', padL);
            document.getElementById('ch-line-h').setAttribute('y1', cy);
            document.getElementById('ch-line-h').setAttribute('x2', cx);
            document.getElementById('ch-line-h').setAttribute('y2', cy);

            document.getElementById('ch-line-v').setAttribute('x1', cx);
            document.getElementById('ch-line-v').setAttribute('y1', cy);
            document.getElementById('ch-line-v').setAttribute('x2', cx);
            document.getElementById('ch-line-v').setAttribute('y2', svgH - padB);
        }

        function renderGraphAxes(cfg) {
            const minorG = document.getElementById('grid-minor');
            const majorG = document.getElementById('grid-major');
            const axesG = document.getElementById('axes-layer');
            
            minorG.innerHTML = ''; majorG.innerHTML = ''; axesG.innerHTML = '';
            document.getElementById('scaffold-overlays').innerHTML = '';

            let boxSize = 7; 
            let numBoxesX = 50; 
            let numBoxesY = (cfg.totalFreq === 60) ? 60 : (cfg.totalFreq === 80 ? 40 : (cfg.totalFreq === 100 ? 50 : 60));
            cfg.numBoxesY = numBoxesY;

            let unitsPerBoxY = cfg.totalFreq / numBoxesY;
            cfg.unitsPerBoxY = unitsPerBoxY;

            graphW = numBoxesX * boxSize; 
            graphH = numBoxesY * boxSize; 
            
            svgW = graphW + padL + padR;
            svgH = graphH + padT + padB;

            document.getElementById('graph-svg').setAttribute('viewBox', `0 0 ${svgW} ${svgH}`);

            for (let i = 0; i <= numBoxesX; i++) {
                let svgX = mapToSVGX(i, cfg);
                let line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                line.setAttribute('x1', svgX); line.setAttribute('y1', mapToSVGY(0, cfg));
                line.setAttribute('x2', svgX); line.setAttribute('y2', mapToSVGY(cfg.totalFreq, cfg));

                if (i % 5 === 0) {
                    line.setAttribute('stroke', '#94a3b8'); line.setAttribute('stroke-width', '1');
                    majorG.appendChild(line);

                    let txt = document.createElementNS("http://www.w3.org/2000/svg", "text");
                    txt.setAttribute('x', svgX); txt.setAttribute('y', mapToSVGY(0, cfg) + 14);
                    txt.setAttribute('text-anchor', 'middle'); txt.setAttribute('font-size', '9');
                    txt.setAttribute('fill', '#475569');
                    txt.textContent = i;
                    axesG.appendChild(txt);
                } else {
                    line.setAttribute('stroke', '#e2e8f0'); line.setAttribute('stroke-width', '0.5');
                    minorG.appendChild(line);
                }
            }

            for (let i = 0; i <= numBoxesY; i++) {
                let currentYVal = i * unitsPerBoxY;
                let svgY = mapToSVGY(currentYVal, cfg);
                let line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                line.setAttribute('x1', mapToSVGX(0, cfg)); line.setAttribute('y1', svgY);
                line.setAttribute('x2', mapToSVGX(50, cfg)); line.setAttribute('y2', svgY);

                if (i % 5 === 0) {
                    line.setAttribute('stroke', '#94a3b8'); line.setAttribute('stroke-width', '1');
                    majorG.appendChild(line);

                    let txt = document.createElementNS("http://www.w3.org/2000/svg", "text");
                    txt.setAttribute('x', mapToSVGX(0, cfg) - 6); txt.setAttribute('y', svgY + 3);
                    txt.setAttribute('text-anchor', 'end'); txt.setAttribute('font-size', '9');
                    txt.setAttribute('fill', '#475569');
                    txt.textContent = currentYVal;
                    axesG.appendChild(txt);
                } else {
                    line.setAttribute('stroke', '#e2e8f0'); line.setAttribute('stroke-width', '0.5');
                    minorG.appendChild(line);
                }
            }

            let bx = document.createElementNS("http://www.w3.org/2000/svg", "line");
            bx.setAttribute('x1', mapToSVGX(0, cfg)); bx.setAttribute('y1', mapToSVGY(0, cfg));
            bx.setAttribute('x2', mapToSVGX(50, cfg)); bx.setAttribute('y2', mapToSVGY(0, cfg));
            bx.setAttribute('stroke', '#1e293b'); bx.setAttribute('stroke-width', '1.5');
            axesG.appendChild(bx);

            let by = document.createElementNS("http://www.w3.org/2000/svg", "line");
            by.setAttribute('x1', mapToSVGX(0, cfg)); by.setAttribute('y1', mapToSVGY(0, cfg));
            by.setAttribute('x2', mapToSVGX(0, cfg)); by.setAttribute('y2', mapToSVGY(cfg.totalFreq, cfg));
            by.setAttribute('stroke', '#1e293b'); by.setAttribute('stroke-width', '1.5');
            axesG.appendChild(by);

            let lx = document.createElementNS("http://www.w3.org/2000/svg", "text");
            lx.setAttribute('x', padL + graphW / 2); lx.setAttribute('y', svgH - 12);
            lx.setAttribute('text-anchor', 'middle'); lx.setAttribute('font-size', '11'); lx.setAttribute('fill', '#0f172a');
            lx.textContent = cfg.xLabel;
            axesG.appendChild(lx);

            let ly = document.createElementNS("http://www.w3.org/2000/svg", "text");
            ly.setAttribute('transform', `rotate(-90, 15, ${padT + graphH / 2})`);
            ly.setAttribute('x', 15); ly.setAttribute('y', padT + graphH / 2);
            ly.setAttribute('text-anchor', 'middle'); ly.setAttribute('font-size', '11'); ly.setAttribute('fill', '#0f172a');
            ly.textContent = cfg.yLabel;
            axesG.appendChild(ly);

            let dStr = "", totalResolutionPoints = 120;
            for(let i = 0; i <= totalResolutionPoints; i++) {
                let currX = (i / totalResolutionPoints) * 50;
                let cx = mapToSVGX(currX, cfg);
                let cy = mapToSVGY(calcCurveY(currX, cfg), cfg);
                dStr += (i === 0 ? "M " : " L ") + cx + " " + cy;
            }
            document.getElementById('curve-path').setAttribute('d', dStr);

            crosshairPos = { x: mapToSVGX(25, cfg), y: mapToSVGY(cfg.totalFreq / 2, cfg) };
            updateCrosshairGraphics(crosshairPos.x, crosshairPos.y);
        }

        function advanceQuestionFlow() {
            if (questionsCountInCurrentGraph === 0 || questionsCountInCurrentGraph >= 3) {
                let randCtx = variableContexts[Math.floor(Math.random() * variableContexts.length)];
                let randMaxY = targetFrequencies[Math.floor(Math.random() * targetFrequencies.length)];
                globalCtx = { ...randCtx, totalFreq: randMaxY };
                questionsCountInCurrentGraph = 1;
                renderGraphAxes(globalCtx);
            } else {
                questionsCountInCurrentGraph++;
            }

            isScaffoldActive = false;
            isFractionMode = false;
            activeFracPart = 'num';
            scaffoldStepIdx = 0;
            currentAttempts = 0;
            stepAttempts = 0;

            document.getElementById('scaffold-badge-el').style.display = 'none';
            document.getElementById('app-feedback').style.display = 'none';
            document.getElementById('app-steps-container').innerHTML = '';
            document.getElementById('calc-display').textContent = '';
            document.getElementById('action-submit-btn').style.display = 'block';
            document.getElementById('action-next-btn').style.display = 'none';

            let qType = Math.floor(Math.random() * 10) + 1; 
            activeQuestion = compileQuestionStructure(qType, globalCtx);

            document.getElementById('app-context').innerHTML = activeQuestion.contextText;
            document.getElementById('app-question').innerHTML = activeQuestion.questionText;
            
            resetGraphView();
            setTool('pointer');
        }

        function compileQuestionStructure(type, cfg) {
            let q = { type: type, answer: 0, isFractionAns: false, isPercentageAns: false, contextText: "", questionText: "", steps: [], toleranceType: 'x' };
            q.contextText = `The graph illustrates the cumulative frequency for the ${cfg.name} belonging to ${cfg.totalFreq} unique ${cfg.noun}.`;

            let q1Y = cfg.totalFreq * 0.25;
            let q2Y = cfg.totalFreq * 0.50;
            let q3Y = cfg.totalFreq * 0.75;

            let q1X = roundXToHalfBox(calcCurveX(q1Y, cfg));
            let q2X = roundXToHalfBox(calcCurveX(q2Y, cfg));
            let q3X = roundXToHalfBox(calcCurveX(q3Y, cfg));
            let iqr = roundXToHalfBox(q3X - q1X);

            switch(type) {
                case 1: // Median
                    q.questionText = `Use the graph to find the value of the median.`;
                    q.answer = q2X;
                    q.toleranceType = 'x';
                    q.steps = [
                        { text: `Calculate the position layout of the median along the vertical axis using the formula:<br><b>50/100 &times; total frequency = 50/100 &times; ${cfg.totalFreq}</b>`, answer: q2Y, toleranceType: 'y', type: 'h', val: q2Y, start: 0, end: q2X, lbl: q2Y },
                        { text: `Trace horizontally to intersect the curve and project straight down to read the median value from the horizontal axis.`, answer: q2X, toleranceType: 'x', type: 'v', val: q2X, start: 0, end: q2Y, lbl: q2X }
                    ];
                    break;

                case 2: // Interquartile Range
                    q.questionText = `Use the graph to find the interquartile range (IQR).`;
                    q.answer = iqr;
                    q.toleranceType = 'x';
                    q.steps = [
                        { text: `Calculate the position layout of the upper quartile (Q3) along the vertical axis using the formula:<br><b>75/100 &times; total frequency = 75/100 &times; ${cfg.totalFreq}</b>`, answer: q3Y, toleranceType: 'y', type: 'h', val: q3Y, start: 0, end: q3X, lbl: q3Y },
                        { text: `Trace across horizontally to intersect the curve, and project straight down to read the Upper Quartile value from the horizontal axis.`, answer: q3X, toleranceType: 'x', type: 'v', val: q3X, start: 0, end: q3Y, lbl: q3X },
                        { text: `Calculate the position layout of the lower quartile (Q1) along the vertical axis using the formula:<br><b>25/100 &times; total frequency = 25/100 &times; ${cfg.totalFreq}</b>`, answer: q1Y, toleranceType: 'y', type: 'h', val: q1Y, start: 0, end: q1X, lbl: q1Y },
                        { text: `Trace across horizontally to intersect the curve, and project straight down to read the Lower Quartile value from the horizontal axis.`, answer: q1X, toleranceType: 'x', type: 'v', val: q1X, start: 0, end: q1Y, lbl: q1X },
                        { text: `Find the interquartile range using the formula:<br><b>Upper Quartile &minus; Lower Quartile</b>`, answer: iqr, toleranceType: 'x' }
                    ];
                    break;

                case 3: // Lower Quartile
                    q.questionText = `Use the graph to find the value of the lower quartile.`;
                    q.answer = q1X;
                    q.toleranceType = 'x';
                    q.steps = [
                        { text: `Calculate the position layout of the lower quartile (Q1) along the vertical axis using the formula:<br><b>25/100 &times; total frequency = 25/100 &times; ${cfg.totalFreq}</b>`, answer: q1Y, toleranceType: 'y', type: 'h', val: q1Y, start: 0, end: q1X, lbl: q1Y },
                        { text: `Trace across horizontally to intersect the curve, and project straight down to read the Lower Quartile value from the horizontal axis.`, answer: q1X, toleranceType: 'x', type: 'v', val: q1X, start: 0, end: q1Y, lbl: q1X }
                    ];
                    break;

                case 4: // Upper Quartile
                    q.questionText = `Use the graph to find the value of the upper quartile.`;
                    q.answer = q3X;
                    q.toleranceType = 'x';
                    q.steps = [
                        { text: `Calculate the position layout of the upper quartile (Q3) along the vertical axis using the formula:<br><b>75/100 &times; total frequency = 75/100 &times; ${cfg.totalFreq}</b>`, answer: q3Y, toleranceType: 'y', type: 'h', val: q3Y, start: 0, end: q3X, lbl: q3Y },
                        { text: `Trace across horizontally to intersect the curve, and project straight down to read the Upper Quartile value from the horizontal axis.`, answer: q3X, toleranceType: 'x', type: 'v', val: q3X, start: 0, end: q3Y, lbl: q3X }
                    ];
                    break;

                case 5: // Less than Threshold Value Counts (Excludes Median)
                    let targetValX5 = 15 + Math.floor(Math.random() * 7) * 5; 
                    if (targetValX5 === q2X) targetValX5 = (targetValX5 >= 40) ? targetValX5 - 10 : targetValX5 + 5;
                    let roundYVal5 = roundYToHalfBox(calcCurveY(targetValX5, cfg), cfg);
                    q.questionText = `Use the graph to estimate the number of ${cfg.noun} who took less than or at most ${targetValX5} ${cfg.unit}.`;
                    q.answer = roundYVal5;
                    q.toleranceType = 'y';
                    q.steps = [
                        { text: `Locate ${targetValX5} ${cfg.unit} on the horizontal axis, trace straight up to intersect the curve, and project horizontally to read the vertical cumulative frequency value.`, answer: roundYVal5, toleranceType: 'y', type: 'h', val: roundYVal5, start: 0, end: targetValX5, lbl: roundYVal5 }
                    ];
                    break;

                case 6: // Greater than Threshold Value Counts (Excludes Median)
                    let targetValX6 = 15 + Math.floor(Math.random() * 7) * 5; 
                    if (targetValX6 === q2X) targetValX6 = (targetValX6 >= 40) ? targetValX6 - 10 : targetValX6 + 5;
                    let roundYVal6 = roundYToHalfBox(calcCurveY(targetValX6, cfg), cfg);
                    q.questionText = `Use the graph to estimate the number of ${cfg.noun} who took more than or at least ${targetValX6} ${cfg.unit}.`;
                    q.answer = cfg.totalFreq - roundYVal6;
                    q.toleranceType = 'y';
                    q.steps = [
                        { text: `Locate ${targetValX6} ${cfg.unit} on the horizontal axis, trace straight up to intersect the curve, and project horizontally to read the vertical cumulative frequency value.`, answer: roundYVal6, toleranceType: 'y', type: 'h', val: roundYVal6, start: 0, end: targetValX6, lbl: roundYVal6 },
                        { text: `Subtract this matching reading value from the total frequency population value of ${cfg.totalFreq}.`, answer: cfg.totalFreq - roundYVal6, toleranceType: 'y' }
                    ];
                    break;

                case 7: // Percentage Evaluations (Excludes Median)
                    let pctX = 15 + Math.floor(Math.random() * 7) * 5; 
                    if (pctX === q2X) pctX = (pctX >= 40) ? pctX - 10 : pctX + 5;
                    let pctYRound = roundYToHalfBox(calcCurveY(pctX, cfg), cfg);
                    q.isPercentageAns = true;
                    q.targetY = pctYRound;
                    q.answer = (pctYRound / cfg.totalFreq) * 100;
                    q.toleranceType = 'pct';
                    q.questionText = `Use the graph to estimate the <b>percentage</b> of ${cfg.noun} who took less than ${pctX} ${cfg.unit}.`;
                    q.steps = [
                        { text: `Locate ${pctX} ${cfg.unit} on the horizontal axis, trace straight up to intersect the curve, and project horizontally to find the cumulative count value.`, answer: pctYRound, toleranceType: 'y', type: 'h', val: pctYRound, start: 0, end: pctX, lbl: pctYRound },
                        { text: `Convert this value to a percentage out of the total frequency population of ${cfg.totalFreq}.`, answer: (pctYRound / cfg.totalFreq) * 100, toleranceType: 'pct' }
                    ];
                    break;

                case 8: // Probability Question Evaluator (Excludes Median)
                    let probX = 15 + Math.floor(Math.random() * 7) * 5;
                    if (probX === q2X) probX = (probX >= 40) ? probX - 10 : probX + 5;
                    let probYRound = roundYToHalfBox(calcCurveY(probX, cfg), cfg);
                    q.isFractionAns = true;
                    q.targetY = probYRound;
                    q.questionText = `Use the graph to estimate the probability that a randomly selected ${cfg.noun.slice(0,-1)} took less than ${probX} ${cfg.unit}. Give your answer as a fraction.`;
                    q.steps = [
                        { text: `Find the cumulative count of ${cfg.noun} who took less than ${probX} ${cfg.unit} by reading the graph vertical axis value.`, answer: probYRound, toleranceType: 'y', type: 'h', val: probYRound, start: 0, end: probX, lbl: probYRound },
                        { text: `Express this count value as a fraction over the total frequency population of ${cfg.totalFreq}.`, isFractionAns: true, targetY: probYRound }
                    ];
                    break;

                case 9: // Custom Lower Percentiles (10th, 20th, 30th, 40th)
                case 10: // Custom Upper Percentiles (60th, 70th, 80th, 90th)
                    let pcts = (type === 9) ? [10, 20, 30, 40] : [60, 70, 80, 90];
                    let pickedPct = pcts[Math.floor(Math.random() * pcts.length)];
                    let pY = cfg.totalFreq * (pickedPct / 100);
                    let pX = roundXToHalfBox(calcCurveX(pY, cfg));
                    
                    q.questionText = `Use the graph to find the value of the ${pickedPct}th percentile.`;
                    q.answer = pX;
                    q.toleranceType = 'x';
                    q.steps = [
                        { text: `Calculate the position layout of the ${pickedPct}th percentile along the vertical axis using the formula:<br><b>${pickedPct}/100 &times; total frequency = ${pickedPct}/100 &times; ${cfg.totalFreq}</b>`, answer: pY, toleranceType: 'y', type: 'h', val: pY, start: 0, end: pX, lbl: pY },
                        { text: `Trace across horizontally to intersect the curve, and project straight down to read the corresponding value from the horizontal axis.`, answer: pX, toleranceType: 'x', type: 'v', val: pX, start: 0, end: pY, lbl: pX }
                    ];
                    break;
            }
            return q;
        }

        function checkNumericalTolerance(submitted, expected, type, cfg) {
            let allowedTolerance = 0.5; 
            if (type === 'y') {
                allowedTolerance = 0.5 * cfg.unitsPerBoxY;
            } else if (type === 'pct') {
                allowedTolerance = ((0.5 * cfg.unitsPerBoxY) / cfg.totalFreq) * 100;
            }
            return Math.abs(submitted - expected) <= (allowedTolerance + 0.001);
        }

        function handleSubmission() {
            let feedback = document.getElementById('app-feedback');
            let isCurrentStepFrac = !isScaffoldActive ? activeQuestion.isFractionAns : activeQuestion.steps[scaffoldStepIdx].isFractionAns;

            let userNum = 0, userDen = 1, userFloat = 0;

            if (isCurrentStepFrac) {
                if (!isFractionMode) {
                    feedback.className = "feedback-box incorrect";
                    feedback.innerHTML = "⚠️ Please use the <b>a/b fraction tool button</b> to enter your answer in fraction form.";
                    feedback.style.display = "block";
                    return;
                }
                let rawN = document.getElementById('frac-num').textContent.trim();
                let rawD = document.getElementById('frac-den').textContent.trim();
                if(rawN === '' || rawD === '') return;
                
                userNum = parseInt(rawN);
                userDen = parseInt(rawD);
                if (isNaN(userNum) || isNaN(userDen) || userDen === 0) {
                    feedback.className = "feedback-box incorrect";
                    feedback.innerHTML = "⚠️ Insert a valid non-zero fraction.";
                    feedback.style.display = "block";
                    return;
                }
                userFloat = userNum / userDen;
            } else {
                if (isFractionMode) {
                    feedback.className = "feedback-box incorrect";
                    feedback.innerHTML = "⚠️ This step expects a standard numeric value, not a fraction form.";
                    feedback.style.display = "block";
                    return;
                }
                let rawInput = document.getElementById('calc-display').textContent.trim();
                if (rawInput === '') return;
                userFloat = parseFloat(rawInput);
                if (isNaN(userFloat)) return;
            }

            if (!isScaffoldActive) {
                let isMainCorrect = false;
                if (activeQuestion.isFractionAns) {
                    let expectedProb = activeQuestion.targetY / globalCtx.totalFreq;
                    let allowedTolProb = (0.5 * globalCtx.unitsPerBoxY) / globalCtx.totalFreq;
                    isMainCorrect = Math.abs(userFloat - expectedProb) <= (allowedTolProb + 0.00001);
                } else {
                    isMainCorrect = checkNumericalTolerance(userFloat, activeQuestion.answer, activeQuestion.toleranceType, globalCtx);
                }

                if (isMainCorrect) {
                    feedback.className = "feedback-box correct";
                    feedback.innerHTML = "🎉 Excellent! Your answer is perfectly correct.";
                    feedback.style.display = "block";
                    
                    if (currentAttempts === 0) {
                        scoreCorrectCount++;
                        document.getElementById('score-correct').textContent = scoreCorrectCount;
                    }
                    revealFinalSolutionOverlay(true);
                } else {
                    currentAttempts++;
                    feedback.className = "feedback-box incorrect";
                    feedback.innerHTML = "❌ That estimate is outside the accepted range. Let's work through this step-by-step together.";
                    feedback.style.display = "block";
                    
                    isScaffoldActive = true;
                    scaffoldStepIdx = 0;
                    stepAttempts = 0;
                    document.getElementById('scaffold-badge-el').style.display = 'inline-block';
                    renderScaffoldStepUI();
                }
            } else {
                let targetStep = activeQuestion.steps[scaffoldStepIdx];
                let isStepCorrect = false;

                if (targetStep.isFractionAns) {
                    let expectedProb = targetStep.targetY / globalCtx.totalFreq;
                    let allowedTolProb = (0.5 * globalCtx.unitsPerBoxY) / globalCtx.totalFreq;
                    isStepCorrect = Math.abs(userFloat - expectedProb) <= (allowedTolProb + 0.00001);
                } else {
                    isStepCorrect = checkNumericalTolerance(userFloat, targetStep.answer, targetStep.toleranceType, globalCtx);
                }

                if (isStepCorrect) {
                    feedback.className = "feedback-box correct";
                    feedback.innerHTML = `✅ Step Correct!`;
                    feedback.style.display = "block";

                    targetStep.status = 'correct';
                    targetStep.recordedValueStr = targetStep.isFractionAns ? `${userNum}/${userDen}` : userFloat;

                    if (targetStep.type) appendOverlayVectorGraphic(targetStep);

                    scaffoldStepIdx++;
                    stepAttempts = 0;

                    if (scaffoldStepIdx < activeQuestion.steps.length) {
                        renderScaffoldStepUI();
                    } else {
                        feedback.className = "feedback-box correct";
                        feedback.innerHTML = `🎉 You have completed all scaffolding guide steps successfully.`;
                        scoreIncorrectCount++;
                        document.getElementById('score-incorrect').textContent = scoreIncorrectCount;
                        wrapUpQuestionLifecycle(true);
                    }
                } else {
                    stepAttempts++;
                    if (stepAttempts >= 2) {
                        feedback.className = "feedback-box incorrect";
                        let displayCorrectVal = targetStep.isFractionAns ? `${targetStep.targetY}/${globalCtx.totalFreq}` : targetStep.answer;
                        feedback.innerHTML = `⚠️ Moving forward. An acceptable reference value for this step is: <b>${displayCorrectVal}</b>.`;
                        feedback.style.display = "block";

                        targetStep.status = 'provided';
                        targetStep.recordedValueStr = displayCorrectVal;

                        if (targetStep.type) appendOverlayVectorGraphic(targetStep);

                        scaffoldStepIdx++;
                        stepAttempts = 0;

                        if (scaffoldStepIdx < activeQuestion.steps.length) {
                            renderScaffoldStepUI();
                        } else {
                            scoreIncorrectCount++;
                            document.getElementById('score-incorrect').textContent = scoreIncorrectCount;
                            wrapUpQuestionLifecycle(false);
                        }
                    } else {
                        feedback.className = "feedback-box incorrect";
                        feedback.innerHTML = `❌ Incorrect value. Try again (1 attempt remaining for this step).`;
                        feedback.style.display = "block";
                    }
                }
            }
        }

        function renderScaffoldStepUI() {
            isFractionMode = false; 
            activeFracPart = 'num';
            document.getElementById('calc-display').textContent = '';
            
            const stepsContainer = document.getElementById('app-steps-container');
            stepsContainer.innerHTML = '';

            activeQuestion.steps.forEach((step, idx) => {
                let div = document.createElement('div');
                div.className = `step-log-item ${idx === scaffoldStepIdx ? 'active' : ''}`;
                
                let title = document.createElement('div');
                title.className = "step-title";
                title.innerHTML = `Step ${idx + 1} of ${activeQuestion.steps.length}`;
                div.appendChild(title);

                let body = document.createElement('div');
                body.innerHTML = step.text;
                div.appendChild(body);

                let status = document.createElement('div');
                status.className = "step-status";
                if (idx < scaffoldStepIdx) {
                    if (step.status === 'correct') {
                        status.style.color = "#16a34a";
                        status.innerHTML = `👉 Value Recorded: <span style="font-weight:700;">${step.recordedValueStr}</span> (Correct)`;
                    } else {
                        status.style.color = "#ea580c";
                        status.innerHTML = `👉 Value Provided: <span style="font-weight:700;">${step.recordedValueStr}</span>`;
                    }
                } else if (idx === scaffoldStepIdx) {
                    status.style.color = "#2563eb";
                    status.style.fontWeight = "700";
                    status.innerHTML = `⏳ Enter value above...`;
                } else {
                    status.style.color = "#94a3b8";
                    status.innerHTML = `Locked`;
                }
                div.appendChild(status);
                stepsContainer.appendChild(div);
            });
        }

        function appendOverlayVectorGraphic(step) {
            const container = document.getElementById('scaffold-overlays');
            let path = document.createElementNS("http://www.w3.org/2000/svg", "line");
            let lx = 0, ly = 0;

            if (step.type === 'h') {
                path.setAttribute('x1', mapToSVGX(step.start, globalCtx));
                path.setAttribute('y1', mapToSVGY(step.val, globalCtx));
                path.setAttribute('x2', mapToSVGX(step.end, globalCtx));
                path.setAttribute('y2', mapToSVGY(step.val, globalCtx));
                lx = mapToSVGX(0, globalCtx) - 4;
                ly = mapToSVGY(step.val, globalCtx) + 3;
            } else {
                path.setAttribute('x1', mapToSVGX(step.val, globalCtx));
                path.setAttribute('y1', mapToSVGY(step.start, globalCtx));
                path.setAttribute('x2', mapToSVGX(step.val, globalCtx));
                path.setAttribute('y2', mapToSVGY(step.end, globalCtx));
                lx = mapToSVGX(step.val, globalCtx);
                ly = mapToSVGY(0, globalCtx) + 14;
            }

            path.setAttribute('stroke', '#dc2626');
            path.setAttribute('stroke-width', '1.5');
            path.setAttribute('stroke-dasharray', '3,3');
            container.appendChild(path);

            let txt = document.createElementNS("http://www.w3.org/2000/svg", "text");
            txt.setAttribute('x', lx); txt.setAttribute('y', ly);
            txt.setAttribute('fill', '#dc2626'); txt.setAttribute('font-size', '9'); txt.setAttribute('font-weight', '700');
            txt.setAttribute('text-anchor', step.type === 'h' ? 'end' : 'middle');
            txt.textContent = step.lbl;
            container.appendChild(txt);
        }

        function revealFinalSolutionOverlay(wasUserCorrect) {
            activeQuestion.steps.forEach(step => {
                if (step.type) appendOverlayVectorGraphic(step);
            });
            wrapUpQuestionLifecycle(wasUserCorrect);
        }

        function wrapUpQuestionLifecycle(wasUserCorrect) {
            document.getElementById('action-submit-btn').style.display = 'none';
            document.getElementById('action-next-btn').style.display = 'block';
            
            if (isFractionMode) {
                let numEl = document.getElementById('frac-num');
                let denEl = document.getElementById('frac-den');
                if (numEl) numEl.classList.remove('active-part');
                if (denEl) denEl.classList.remove('active-part');
            }

            if (wasUserCorrect) {
                if (!isFractionMode) {
                    const display = document.getElementById('calc-display');
                    let currentTxt = display.textContent.trim();
                    if (activeQuestion.isPercentageAns && !currentTxt.includes('%')) {
                        display.textContent = currentTxt + "%";
                    }
                }
                return; 
            }
            
            const display = document.getElementById('calc-display');
            if (activeQuestion.isFractionAns) {
                isFractionMode = true;
                display.innerHTML = `
                    <div class="fraction-view">
                        <div id="frac-num" class="frac-part">${activeQuestion.targetY}</div>
                        <div class="frac-line"></div>
                        <div id="frac-den" class="frac-part">${globalCtx.totalFreq}</div>
                    </div>
                `;
            } else {
                isFractionMode = false;
                display.textContent = activeQuestion.isPercentageAns ? (activeQuestion.answer.toFixed(1) + "%") : activeQuestion.answer;
            }
        }
    </script>
</body>
</html>
